  <!-- Theme flash prevention — reads stored theme before React hydrates -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('cn-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
