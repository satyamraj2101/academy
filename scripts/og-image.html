<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .canvas {
    width: 1200px;
    height: 630px;
    position: relative;
    background: linear-gradient(135deg, #c3d3ec 0%, #cfe0f5 45%, #b9cce8 100%);
    overflow: hidden;
  }
  .dotgrid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(79,70,229,0.16) 1.6px, transparent 1.6px);
    background-size: 26px 26px;
  }
  .orb1 {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,70,229,0.14), transparent 70%);
    top: -200px; right: -140px;
  }
  .orb2 {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(14,165,233,0.16), transparent 70%);
    bottom: -180px; left: -120px;
  }
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
  }
  .logo-row {
    margin-bottom: 40px;
  }
  .logo-row svg {
    height: 92px;
    width: auto;
    display: block;
  }
  h1 {
    font-size: 62px;
    font-weight: 800;
    line-height: 1.14;
    letter-spacing: -0.02em;
    color: #0f172a;
    max-width: 900px;
    margin-bottom: 24px;
  }
  h1 .accent {
    background: linear-gradient(90deg, #4f46e5, #0284c7, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    font-size: 24px;
    font-weight: 500;
    color: #334155;
    max-width: 760px;
    line-height: 1.5;
    margin-bottom: 34px;
  }
  .badges {
    display: flex;
    gap: 14px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.75);
    border: 1.5px solid rgba(79,70,229,0.25);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 17px;
    font-weight: 700;
    color: #4338ca;
  }
  .footer-domain {
    position: absolute;
    bottom: 40px;
    right: 88px;
    z-index: 2;
    font-size: 20px;
    font-weight: 700;
    color: #4338ca;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="dotgrid"></div>
    <div class="orb1"></div>
    <div class="orb2"></div>
    <div class="content">
      <div class="logo-row">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 64" role="img" aria-label="SpotCLM">
          <defs>
            <linearGradient id="lk_comet" x1="145" y1="200" x2="270" y2="96" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#0a2a6a"></stop>
              <stop offset="0.42" stop-color="#1460c8"></stop>
              <stop offset="1" stop-color="#5bc8f5"></stop>
            </linearGradient>
          </defs>
          <text x="4" y="47" font-family="Inter, system-ui, sans-serif" font-size="45" font-weight="800" letter-spacing="-1.4" fill="#0d1f4a">Sp</text>
          <g transform="translate(47.8 2.0) scale(0.122)">
            <path d="M 256 100 A 156 156 0 1 1 127 169 C 136 175 154 187 163 193 A 112 112 0 1 0 256 144 A 22 22 0 0 1 256 100 Z" fill="url(#lk_comet)"></path>
            <circle cx="256" cy="256" r="40" fill="none" stroke="#0a2a63" stroke-width="3.5" stroke-opacity="0.38"></circle>
            <circle cx="256" cy="256" r="23" fill="#0a2a63"></circle>
          </g>
          <text x="99" y="47" font-family="Inter, system-ui, sans-serif" font-size="45" font-weight="800" letter-spacing="-1.4" fill="#0d1f4a">t</text>
          <text x="120" y="47" font-family="Inter, system-ui, sans-serif" font-size="45" font-weight="800" letter-spacing="-1.4" fill="#1246a0">CLM</text>
        </svg>
      </div>
      <h1>Enterprise CLM.<br/><span class="accent">Implemented Right.</span></h1>
      <p class="sub">Certified consultants for Leah, Ironclad, Sirion &amp; Icertis &mdash; from discovery to full team adoption.</p>
      <div class="badges">
        <span class="badge">20+ Years Experience</span>
        <span class="badge">50+ Implementations</span>
        <span class="badge">4 CLM Platforms</span>
      </div>
    </div>
    <div class="footer-domain">spotclm.com</div>
  </div>
</body>
</html>
